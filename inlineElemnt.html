<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    
    <!-- This is an example of inline elements. Inline elements do not start on a new line and only take up as much width as necessary. Examples include <span>, <a>, <strong>, <em>, <img>, and <code>. -->

    <!-- span tag -->
    <p>This is a <span style="color: red;">red</span> word.</p>
    <!-- a tag -->
    <p>Visit <a href="https://www.example.com">Example</a></p>
    <!-- strong tag -->
    <p>This is a <strong>strong</strong> word.</p>
    <!-- em tag -->
    <p>This is an <em>emphasized</em> word.</p>
    <!-- img tag -->
    <p>This is an image: <img src="/pwad73-html/image/luffy.jpg" style="width: 300px; height: auto;" alt="Placeholder Image"> </p>
    <!-- code tag -->   
     <p>This is some <code>code</code>.</p>







</body>
</html>
