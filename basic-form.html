<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>basic form</title>
</head>
<body>
    <form action="submit.html" method="post">
        <label for="name">Name:</label>
        <input type="text" id="name" name="name" required placeholder="Enter your name">
        <br><br>
        <label for="email">Email:</label>
        <input type="email" id="email" name="email" required placeholder="Enter your email"> <br> <br>
        <label for="password">Password:</label>
        <input type="password" id="password" name="password" required placeholder="Enter your password" required> <br> <br >
        <label for="gender">Gender:</label>
        <select id="gender" name="gender" required>
            <option value="none" selected>Select your gender</option>
            <option value="male">Male</option>
            <option value="female">Female</option>
            <option value="other">Other</option>
        </select>    <br > <br >
        <input type="radio" id="male" name="gender" value="male">
        <label for="male">Male</label>
        <input type="radio" id="female" name="gender" value="female">
        <label for="female">Female</label>
        <input type="radio" id="other" name="gender" value="other">
        <label for="other">Other</label> <br><br>
        <label for="dob">Date of Birth:</label>
        <input type="date" id="dob" name="dob" required> <br><br>
        <label for="bio">Bio:</label> <br>
        <textarea id="bio" name="bio" rows="10" cols="30" placeholder="Tell us about yourself"></textarea>
        <br><br>
        <input type="submit" value="Submit">
    </form>
</body>
</html>
